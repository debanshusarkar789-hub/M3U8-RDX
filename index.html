<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rdxdebanshu@7 M3U8 Player</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Load HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        /* Define Colors */
        :root {
            --royal-blue: #4169E1;
            --royal-shadow: rgba(65, 105, 225, 0.5);
            --neon-red: #FF073A; /* Bright Red/Crimson */
        }

        /* Custom styles to apply the Inter font globally */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000; /* Pure black background */
        }
        .player-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            /* Royal Blue shadow effect */
            box-shadow: 0 0 40px var(--royal-shadow);
            border: 1px solid var(--royal-blue);
            border-radius: 1rem;
            overflow: hidden;
            background-color: #111827; /* Darker interior for contrast */
        }
        video {
            display: block;
            width: 100%;
            background-color: #000;
        }
        
        /* Royal Blue Accent Class */
        .royal-blue-accent {
            background-color: var(--royal-blue);
            color: #FFFFFF;
        }

        /* Control Button Styling */
        .custom-controls button {
            transition: background-color 0.15s, transform 0.1s, box-shadow 0.15s;
            font-weight: 700;
        }
        .custom-controls button:hover {
            background-color: rgba(65, 105, 225, 0.8); /* Darker royal blue hover */
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(65, 105, 225, 0.7);
        }

        /* --- Neon Red Live Indicator Animation --- */
        @keyframes pulse-live {
            0% { opacity: 1; box-shadow: 0 0 0 0px var(--neon-red); }
            50% { opacity: 0.8; box-shadow: 0 0 10px 4px rgba(255, 7, 58, 0.6); }
            100% { opacity: 1; box-shadow: 0 0 0 0px var(--neon-red); }
        }

        .live-indicator {
            display: flex;
            align-items: center;
            font-weight: 900;
            background-color: var(--neon-red);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid white;
            text-shadow: 0 0 6px white; /* Inner glow effect for text */
            box-shadow: 0 0 8px var(--neon-red); /* Base neon glow */
            animation: pulse-live 1.5s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="player-container">
        <!-- Player Title with Live Indicator -->
        <header class="p-4 text-center text-xl md:text-2xl royal-blue-accent font-extrabold">
            <div class="flex justify-center items-center space-x-4">
                <h1 class="tracking-widest" style="font-weight: 900;">rdxdebanshu@7</h1>
                <span class="live-indicator text-xs">LIVE</span>
            </div>
        </header>

        <!-- Video Element -->
        <video id="video" controls></video>

        <!-- Stream Input and Control Panel -->
        <div class="p-4 space-y-4">
            <!-- Removed the 'value' attribute here -->
            <input type="text" id="streamUrl" placeholder="Enter M3U8 Stream URL here"
                   class="w-full p-3 rounded-lg border-2 border-gray-700 bg-gray-900 text-white placeholder-gray-500 focus:outline-none focus:border-[var(--royal-blue)] focus:ring-1 focus:ring-[var(--royal-blue)] transition">

            <div class="flex flex-col sm:flex-row justify-center space-y-2 sm:space-y-0 sm:space-x-4 custom-controls">
                <button id="loadButton" class="w-full sm:w-1/2 p-3 rounded-lg text-white royal-blue-accent hover:bg-blue-700 transition duration-300 shadow-md">
                    Load Stream
                </button>
                <button id="messageBoxClose" class="w-full sm:w-1/2 p-3 rounded-lg text-white font-bold bg-gray-600 hover:bg-gray-700 transition duration-300 shadow-md" style="display: none;">
                    Close Status Message
                </button>
            </div>
            
            <!-- Message Box for status/errors -->
            <div id="messageBox" class="hidden p-3 rounded-lg text-center font-semibold text-sm transition-opacity duration-300"></div>

            <!-- Library Status Indicator -->
            <div id="status" class="text-center text-xs text-gray-400 mt-2">
                HLS.js Status: <span id="hlsStatus" class="text-red-400">Loading...</span>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const streamUrlInput = document.getElementById('streamUrl');
        const loadButton = document.getElementById('loadButton');
        const hlsStatus = document.getElementById('hlsStatus');
        const messageBox = document.getElementById('messageBox');
        const messageBoxClose = document.getElementById('messageBoxClose');
        const ROYAL_BLUE = '#4169E1';

        // --- Utility Functions for UI/Messaging ---

        /**
         * Shows a message in the custom message box UI.
         * @param {string} message - The text to display.
         * @param {string} type - 'success', 'error', or 'info'.
         */
        function showMessage(message, type) {
            messageBox.innerHTML = message;
            messageBox.classList.remove('hidden', 'bg-green-600', 'bg-red-600', 'bg-yellow-600');
            messageBoxClose.style.display = 'block';

            if (type === 'error') {
                messageBox.classList.add('bg-red-600');
                messageBox.style.color = '#FFFFFF';
            } else if (type === 'success') {
                messageBox.classList.add('bg-green-600');
                messageBox.style.color = '#FFFFFF';
            } else { // info
                messageBox.classList.add('bg-yellow-600');
                messageBox.style.color = '#000000';
            }
        }

        function hideMessage() {
            messageBox.classList.add('hidden');
            messageBoxClose.style.display = 'none';
        }

        // --- HLS.js Initialization and Logic ---

        function loadM3u8Stream(url) {
            hideMessage();
            if (!url) {
                showMessage("Please enter a valid M3U8 URL.", 'info');
                return;
            }

            // Clean up previous HLS instance if it exists
            if (video.hlsInstance) {
                video.hlsInstance.destroy();
                video.hlsInstance = null;
            }

            // 1. Check if HLS is supported
            if (Hls.isSupported()) {
                hlsStatus.textContent = 'Supported';
                hlsStatus.style.color = '#4ade80'; // Green

                // 2. Initialize HLS.js
                const hls = new Hls();
                video.hlsInstance = hls; // Store instance for cleanup

                // 3. Bind events
                hls.on(Hls.Events.MEDIA_ATTACHED, function () {
                    console.log("Media attached to HLS");
                });
                
                hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                    console.log("Manifest parsed, found " + data.levels.length + " quality levels");
                    showMessage(`Stream loaded successfully with ${data.levels.length} quality levels.`, 'success');
                    video.play().catch(e => console.error("Autoplay failed:", e));
                });
                
                hls.on(Hls.Events.ERROR, function (event, data) {
                    let errorMsg = `HLS Error: ${data.details}. Fatal: ${data.fatal}.`;
                    console.error(errorMsg, data);

                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                // Try to recover network error
                                console.log("Fatal network error detected, trying to recover...");
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.log("Fatal media error detected, trying to recover...");
                                hls.recoverMediaError();
                                break;
                            default:
                                // Cannot recover, destroy HLS instance
                                showMessage(`Fatal Error: Could not load stream. ${errorMsg}`, 'error');
                                hls.destroy();
                                break;
                        }
                    } else {
                        showMessage(`Warning: Non-fatal error occurred: ${data.details}.`, 'info');
                    }
                });

                // 4. Load stream
                hls.loadSource(url);
                hls.attachMedia(video);

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // For native HLS support (e.g., iOS Safari)
                hlsStatus.textContent = 'Native Supported';
                hlsStatus.style.color = '#60a5fa'; // Light Blue
                showMessage("Using native HLS support.", 'info');
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play().catch(e => console.error("Autoplay failed:", e));
                });
            } else {
                hlsStatus.textContent = 'Not Supported';
                hlsStatus.style.color = '#f87171'; // Red
                showMessage("Your browser does not support HLS playback.", 'error');
            }
        }

        // --- Event Listeners ---
        
        loadButton.addEventListener('click', () => {
            const url = streamUrlInput.value.trim();
            loadM3u8Stream(url);
        });

        messageBoxClose.addEventListener('click', hideMessage);

        // --- Initial Load ---
        window.onload = function() {
            const url = streamUrlInput.value.trim();
            if (url) {
                // If the user somehow populated the field, load it.
                loadM3u8Stream(url);
            } else {
                // Display initial instructions
                showMessage("Please enter an M3U8 stream URL and click 'Load Stream' to begin.", 'info');
                hlsStatus.textContent = 'Ready';
                hlsStatus.style.color = '#fff';
            }
        };
        
    </script>

</body>
</html>
